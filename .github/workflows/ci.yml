name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python tools
        run: python -m compileall -q tools
      - name: Parse workflow.json
        run: python -c "import json; json.load(open('workflow.json', encoding='utf-8'))"
